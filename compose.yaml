services:
  gateway:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GATEWAY_PUBLISHED_PORT:-18989}:18989"
      - "127.0.0.1:18765:18765"
    environment:
      GATEWAY_ADMIN_PASSWORD: ${GATEWAY_ADMIN_PASSWORD:?Set GATEWAY_ADMIN_PASSWORD in untracked .env for the non-loopback container bind}
      GATEWAY_PUBLIC_ORIGIN: "${GATEWAY_PUBLIC_ORIGIN:-http://127.0.0.1:${GATEWAY_PUBLISHED_PORT:-18989}}"
    volumes:
      - gateway-state:/data
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
volumes:
  gateway-state:
